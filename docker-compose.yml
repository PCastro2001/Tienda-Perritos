version: '3.8'

services:
  db:
    build:
      context: ./db
    container_name: tienda-db
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: tienda_perritos
    networks:
      - tienda-network

  backend:
    build:
      context: ./backend
    container_name: tienda-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=admin123
      - DB_NAME=tienda_perritos
      - DB_PORT=3306
    depends_on:
      - db
    networks:
      - tienda-network

  frontend:
    build:
      context: ./frontend
    container_name: tienda-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - tienda-network

networks:
  tienda-network:
    driver: bridge

volumes:
  dbdata: